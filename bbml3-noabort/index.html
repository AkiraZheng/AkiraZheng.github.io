<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBML3 永不 abort 演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f8f9fa;padding:16px;color:#333}
.c{max-width:900px;margin:0 auto}
h1{font-size:18px;margin-bottom:8px;color:#1a1a2e}
.sub{font-size:13px;color:#666;margin-bottom:16px}
.ctl{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
button:disabled{opacity:.4;cursor:not-allowed}
#bPrev{background:#e0e0e0;color:#333}
#bNext{background:#4a6fa5;color:#fff}
#bNext:hover:not(:disabled){background:#3d5d8a}
#bRst{background:#95a5a6;color:#fff}
.sp{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:20px;min-height:420px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nar{background:#eef5ff;border-left:4px solid #4a6fa5;padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:20px;font-size:14px;line-height:1.7}
.nar b{color:#4a6fa5}
.twocol{display:flex;gap:20px;margin-top:10px}
.col{flex:1;min-width:0}
.col h3{font-size:12px;color:#666;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.ptree,.tlb{background:#f9fafb;border:1px solid #e0e0e0;border-radius:8px;padding:14px;min-height:280px;font-size:12px}
.pnode{padding:8px 10px;margin:4px 0;border-radius:6px;font-family:monospace;font-size:12px;transition:all .5s}
.pnode.block{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;font-weight:600}
.pnode.table{background:#dbeafe;border:1px solid #93c5fd;color:#1e40af;font-weight:600}
.pnode.page{background:#dcfce7;border:1px solid #86efac;color:#166534;font-size:11px}
.pnode.changing{animation:flash .8s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 rgba(74,111,165,0)}50%{box-shadow:0 0 12px rgba(74,111,165,.6)}}
.pnode .lbl{font-size:10px;color:#999;font-family:sans-serif;margin-right:6px}
.arrow{color:#ccc;font-size:10px;padding-left:16px}
.indent{padding-left:24px}
.tent{padding:10px 12px;margin:6px 0;border-radius:8px;font-size:12px;transition:all .5s}
.tent.s2{background:#fee2e2;border:2px solid #f87171}
.tent.s4{background:#fef3c7;border:2px solid #fbbf24}
.tent .tag{font-family:monospace;font-weight:700}
.tent .sz{font-size:10px;color:#666;display:inline-block;margin-left:8px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.06)}
.tent .age{font-size:9px;padding:2px 6px;border-radius:4px;float:right}
.tent .age.old{background:#fee2e2;color:#991b1b}
.tent .age.new{background:#dcfce7;color:#166534}
.tent.new{animation:popin .5s}
@keyframes popin{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.ops{text-align:center;margin:12px 0;font-size:13px}
.step-tag{display:inline-block;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;margin:0 2px}
.step-tag.active{transform:scale(1.05)}
.step-tag.done{opacity:.5}
.st-write{background:#e67e22;color:#fff}
.st-tlbi{background:#ef4444;color:#fff}
.st-none{background:#e0e0e0;color:#666}
.mhb{border-radius:12px;padding:16px;margin-top:12px;font-size:14px;line-height:1.8;display:none}
.mhb.show{display:block;animation:popin .5s}
.mhb.multi{background:#fee2e2;border:2px solid #ef4444;color:#991b1b}
.mhb.abort-bbml2{background:#fef3c7;border:2px solid #f59e0b;color:#92400e}
.mhb.abort-bbml3{background:#dcfce7;border:2px solid #22c55e;color:#166534}
.mhb b{font-size:16px}
.si{display:flex;gap:6px;margin-top:12px;justify-content:center}
.sd{width:10px;height:10px;border-radius:50%;background:#ddd;transition:background .3s}
.sd.act{background:#4a6fa5}
.sd.done{background:#93c5fd}
.fn{text-align:center;font-size:11px;color:#aaa;margin-top:16px}
</style>
</head>
<body>
<div class="c">
<h1>BBML3 永不 abort 演示</h1>
<div class="sub">页表合并(小变大) → 直接改页表 → 新旧并存 → multi-hit 时 BBML3 永不 abort</div>
<div class="ctl">
<button id="bPrev" onclick="prev()">← 上一步</button>
<button id="bNext" onclick="next()">下一步 →</button>
<button id="bRst" onclick="rst()">↺ 重置</button>
</div>
<div class="sp">
<div id="content"></div>
<div class="si" id="si"></div>
</div>
<div class="fn">BBML3 = BBML2 的全部放松 + "永不产生 TLB conflict abort" → 内核关键路径安全</div>
</div>
<script>
var step=0,totalSteps=7;
var steps=[
{n:'<b>初始状态:</b> 512 个连续 4KB 页(L2 Table → 512 个 L3 PTE)。CPU 之前访问过页 #0(VA 0x12340000)，TLB 缓存了 4KB entry。',pt:'table',tlb:'old4kb',ops:[],mhb:''},
{n:'<b>直接改页表(BBML2/BBML3 方式):</b> L2 Table entry → Block entry(2MB)。<b>不 invalid、不用 nT、无中间 TLBI</b>！旧 4KB entry 仍然在 TLB 里。',pt:'block',tlb:'old4kb',ops:[{c:'st-write',t:'✏️ 直接写 Block',a:1},{c:'st-none',t:' 无 invalid'},{c:'st-none',t:'❌ 无 nT'},{c:'st-none',t:'❌ 无中间 TLBI'}],mhb:''},
{n:'<b>CPU 访问页 #1(VA 0x12341000):</b> 旧 4KB entry 只覆盖页 #0，<b>盖不住页 #1</b> → TLB miss → walk → 填充 2MB entry。',pt:'block',tlb:'both',ops:[{c:'st-write',t:'✏️ 直接写',a:0},{c:'st-none',t:' 访问页#1 miss → walk → 填充 2MB'}],mhb:'multi'},
{n:'<b>MULTI-HIT!</b> 旧 4KB(页#0) + 新 2MB(覆盖#0~#511) 同时存在于 TLB。Tag 不同，能共存。访问页 #0 时同时命中两条。',pt:'block',tlb:'both',ops:[{c:'st-write',t:'✏️ 直接写',a:0}],mhb:'multi-detail'},
{n:'<b>BBML2 下：可能 abort!</b> CPU 侧 BBML2 不禁止 TLB conflict abort（IHYQMB）。如果内核缺页路径（abort 上下文）里触发 conflict abort → <b>递归 abort，无法恢复!</b>',pt:'block',tlb:'both',ops:[{c:'st-write',t:'✏️ 直接写',a:0}],mhb:'abort-bbml2'},
{n:'<b>BBML3 下：永不 abort!</b> abort 被架构禁止，multi-hit 只返回与任一编程值一致的结果。内核关键路径（缺页处理/mTHP 折叠）不会被递归 abort 打断 → <b>可用于任意内核映射</b>。',pt:'block',tlb:'both',ops:[{c:'st-write',t:'✏️ 直接写',a:0}],mhb:'abort-bbml3'},
{n:'<b>最终 TLBI 收尾:</b> 调用者做一次最终 TLBI，把新旧 entry 全部清掉。之后访问 miss → walk 读到新页表 → 只填充新 2MB entry。页表合并完成！',pt:'block',tlb:'empty',ops:[{c:'st-tlbi',t:'📡 最终 TLBI',a:1}],mhb:''}
];
function ptreeHTML(type){
var tbl=type==='table'?'<div class="pnode table"><span class="lbl">L2</span>Table → 指向 L3 页表</div><div class="indent"><div class="pnode page"><span class="lbl">L3[0]</span>Page(4KB) OA=0x67890+0</div><div class="pnode page"><span class="lbl">L3[1]</span>Page(4KB) OA=0x67890+1</div><div style="font-size:10px;color:#999;text-align:center;padding:4px">... 共 512 个</div></div>':'';
var blk=type==='block'?'<div class="pnode block changing"><span class="lbl">L2</span>Block(2MB) OA=0x67890, Valid=1</div><div style="font-size:10px;color:#999;text-align:center;padding:4px">L3 页表已释放</div>':'';
return '<div class="pnode table"><span class="lbl">L1</span>Table → 指向 L2</div><div class="arrow">↓</div>'+tbl+blk;
}
function tlbHTML(type){
if(type==='old4kb')return '<div class="tent s4"><span class="age old">旧</span><span class="tag">VA=0x12340000 (页#0) → tag VA[47:12]=0x12340</span><span class="sz">4KB</span><br><small>OA=0x67890, RW, WB</small></div>';
if(type==='both')return '<div class="tent s4"><span class="age old">旧</span><span class="tag">VA=0x12340000 (页#0) → tag VA[47:12]=0x12340</span><span class="sz">4KB</span><br><small>OA=0x67890, RW, WB</small></div><div class="tent s2 new"><span class="age new">新</span><span class="tag">VA=0x12340000~0x12540000 → tag VA[47:21]=0x91A0</span><span class="sz">2MB</span><br><small>OA=0x67890, RW, WB</small></div>';
if(type==='empty')return '<div class="tent s4"><span class="tag">VA=0x12340000~0x12540000 → tag VA[47:21]=0x91A0</span><span class="sz">2MB</span><br><small>OA=0x67890, RW, WB</small><br><small style="color:#166534">✓ 最终 TLBI 后只剩新 entry</small></div>';
return '';
}
function opsHTML(ops){
if(!ops.length)return '';
return '<div class="ops">'+ops.map(function(o){var cls=o.a===undefined?'':(o.a?' active':' done');return '<span class="step-tag '+o.c+cls+'">'+o.t+'</span>'}).join('')+'</div>';
}
function mhbHTML(type){
if(!type)return '';
if(type==='multi')return '<div class="mhb show multi"><b>⚠ MULTI-HIT 条件成立!</b><br>旧 4KB(页#0) + 新 2MB(覆盖#0~#511)<br>Tag 不同(4KB vs 2MB)，能共存</div>';
if(type==='multi-detail')return '<div class="mhb show multi"><b>⚠ MULTI-HIT!</b><br>访问页 #0(VA 0x12340000) → 同时命中两条:<br>• 4KB entry: tag VA[47:12]=0x12340 ✓<br>• 2MB entry: tag VA[47:21]=0x91A0 ✓</div>';
if(type==='abort-bbml2')return '<div class="mhb show abort-bbml2"><b>BBML2: 可能 abort!</b><br>CPU 侧不禁止 TLB conflict abort（IHYQMB）<br>如果发生在内核 abort 上下文 → <b>递归 abort，无法恢复</b></div>';
if(type==='abort-bbml3')return '<div class="mhb show abort-bbml3"><b>BBML3: 永不 abort!</b><br>abort 被架构禁止，multi-hit 只返回一致结果<br>内核关键路径不被递归 abort 打断 → <b>可用于任意内核映射</b></div>';
return '';
}
function render(){
var s=steps[step];
var html='<div class="nar">'+s.n+'</div>';
html+='<div class="twocol"><div class="col"><h3>📄 页表 (内存)</h3><div class="ptree">'+ptreeHTML(s.pt)+'</div></div>';
html+='<div class="col"><h3>🔐 TLB</h3><div class="tlb">'+tlbHTML(s.tlb)+'</div></div></div>';
html+=opsHTML(s.ops);
html+=mhbHTML(s.mhb);
document.getElementById('content').innerHTML=html;
document.getElementById('bPrev').disabled=step<=0;
document.getElementById('bNext').disabled=step>=totalSteps-1;
var d='';for(var i=0;i<totalSteps;i++)d+='<div class="sd'+(i===step?' act':i<step?' done':'')+'"></div>';
document.getElementById('si').innerHTML=d;
}
function next(){if(step<totalSteps-1)step++;render()}
function prev(){if(step>0)step--;render()}
function rst(){step=0;render()}
rst();
</script>
</body>
</html>
