<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLB Multi-Hit 演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f8f9fa;padding:16px;color:#333}
.c{max-width:900px;margin:0 auto}
h1{font-size:18px;margin-bottom:8px;color:#1a1a2e}
.sub{font-size:13px;color:#666;margin-bottom:16px}
.ctl{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
button:disabled{opacity:.4;cursor:not-allowed}
#bPrev{background:#e0e0e0;color:#333}
#bNext{background:#4a6fa5;color:#fff}
#bNext:hover:not(:disabled){background:#3d5d8a}
#bRst{background:#95a5a6;color:#fff}
.sp{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:20px;min-height:420px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nar{background:#eef5ff;border-left:4px solid #4a6fa5;padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:20px;font-size:14px;line-height:1.7}
.nar b{color:#4a6fa5}
.pe-row{display:flex;gap:16px;margin:12px 0;align-items:stretch}
.pe-box{flex:1;border:1px solid #ddd;border-radius:8px;padding:12px;min-height:100px}
.pe-box h4{font-size:12px;color:#666;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.pe-a{background:#eff6ff;border-color:#93c5fd}
.pe-b{background:#fef3f2;border-color:#fca5a5}
.shared-l2{background:#f9fafb;border:2px dashed #d1d5db;border-radius:8px;padding:12px;margin:12px 0}
.shared-l2 h4{font-size:12px;color:#666;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.tent{padding:8px 10px;margin:4px 0;border-radius:6px;font-size:11px;transition:all .5s;font-family:monospace}
.tent.s2{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.tent.s4{background:#fef3c7;border:1px solid #fbbf24;color:#92400e}
.tent.empty{color:#ccc;text-align:center;padding:16px;font-style:italic}
.tent.new-entry{animation:popin .5s}
@keyframes popin{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.ops{text-align:center;margin:10px 0;font-size:12px}
.step-tag{display:inline-block;padding:4px 12px;border-radius:4px;font-size:12px;font-weight:600;margin:0 2px}
.step-tag.active{transform:scale(1.05)}
.step-tag.done{opacity:.5}
.st-visit{background:#3b82f6;color:#fff}
.st-walk{background:#8b5cf6;color:#fff}
.st-fill{background:#22c55e;color:#fff}
.st-cascade{background:#f59e0b;color:#fff}
.st-query{background:#e67e22;color:#fff}
.st-none{background:#e0e0e0;color:#666}
.mhb{border-radius:12px;padding:16px;margin-top:12px;font-size:14px;line-height:1.8;display:none}
.mhb.show{display:block;animation:popin .5s}
.mhb.multi{background:#fee2e2;border:2px solid #ef4444;color:#991b1b}
.mhb.ok{background:#dcfce7;border:2px solid #22c55e;color:#166534}
.mhb b{font-size:16px}
.flow-arrow{text-align:center;color:#4a6fa5;font-size:14px;margin:4px 0;font-weight:bold}
.si{display:flex;gap:6px;margin-top:12px;justify-content:center}
.sd{width:10px;height:10px;border-radius:50%;background:#ddd;transition:background .3s}
.sd.act{background:#4a6fa5}
.sd.done{background:#93c5fd}
.fn{text-align:center;font-size:11px;color:#aaa;margin-top:16px}
</style>
</head>
<body>
<div class="c">
<h1>TLB Multi-Hit 交互演示</h1>
<div class="sub">多 PE + 共享 L2 TLB → walk 填装与级联 → 新旧 entry 并存 → multi-hit → 最终 TLBI → 重新 walk</div>
<div class="ctl">
<button id="bPrev" onclick="prev()">← 上一步</button>
<button id="bNext" onclick="next()">下一步 →</button>
<button id="bRst" onclick="rst()">↺ 重置</button>
</div>
<div class="sp">
<div id="content"></div>
<div class="si" id="si"></div>
</div>
<div class="fn">关键：walk 结果先填 PE-B 私有 L1，再级联到共享 L2 → PE-A 查共享 L2 时新旧并存</div>
</div>
<script>
var step=0,totalSteps=11;
var steps=[
{n:'<b>初始状态:</b> 访问 VA 0x12345678。页表 L2 是 Block(2MB)映射。PE-A 之前访问过，L1 TLB 缓存了 2MB entry。PE-B 还没访问过。',pe:'init',l2:'old2mb',ops:[],mhb:''},
{n:'<b>PE-A 访问 VA 0x12345678:</b> L1 TLB 命中旧 2MB entry → 直接返回翻译，<b>不会 walk</b>。',pe:'a-hit',l2:'old2mb',ops:[{c:'st-visit',t:'PE-A 访问',a:1},{c:'st-none',t:'❌ 不 walk (hit)'}],mhb:''},
{n:'<b>软件直接改页表（BBML2 方式）:</b> L2 Block → Table，指向新 L3 页表。<b>不 invalid、不 TLBI</b>。PE-A 的 L1 TLB 里旧 2MB entry 还在。',pe:'a-hit',l2:'old2mb',ops:[{c:'st-none',t:'PE-A: 旧 entry 还在'}],mhb:''},
{n:'<b>PE-B 访问 VA 0x12345678:</b> PE-B 的 L1 TLB 没有该地址 → <b>miss</b> → 查共享 L2 TLB → 也没有 → miss → walk。',pe:'b-miss',l2:'old2mb',ops:[{c:'st-visit',t:'PE-B 访问',a:1},{c:'st-walk',t:'🔍 miss → walk',a:1}],mhb:''},
{n:'<b>PE-B walk 页表:</b> 读到新的 L2 Table → L3 Page → 翻译结果为 4KB。walk 结果<b>先填入 PE-B 私有 L1 TLB</b>。',pe:'b-walk-l1',l2:'old2mb',ops:[{c:'st-walk',t:'🔍 walk 读到 4KB',a:0},{c:'st-fill',t:'① 填入 PE-B L1',a:1}],mhb:''},
{n:'<b>级联填入共享 L2 TLB:</b> walk 结果同时/随后<b>级联到共享 L2 TLB</b>。此时共享 L2 里出现新 4KB entry，与旧 2MB entry 并存！',pe:'b-walk-l2',l2:'both',ops:[{c:'st-fill',t:'① 填入 PE-B L1',a:0},{c:'st-cascade',t:'② 级联到共享 L2',a:1}],mhb:'multi'},
{n:'<b>共享 L2 TLB 两条并存!</b> 旧 2MB + 新 4KB，Tag 不同（VA[47:21]+2MB ≠ VA[47:12]+4KB），能共存。',pe:'both-have',l2:'both',ops:[{c:'st-cascade',t:'② 级联到共享 L2',a:0}],mhb:'multi-detail'},
{n:'<b>PE-A 后续访问:</b> L1 miss（旧 entry 被淘汰）→ 查共享 L2 TLB → <b>同时命中旧 2MB 和新 4KB = MULTI-HIT!</b>',pe:'a-l2-query',l2:'both',ops:[{c:'st-query',t:'PE-A 查共享 L2',a:1}],mhb:'multi-detail'},
{n:'<b>最终 TLBI:</b> 调用者做最终 TLBI，<b>新旧全部清掉</b>（TLBI 按地址失效，不区分新旧版本）。TLB 里该地址为空。',pe:'clean',l2:'empty',ops:[{c:'st-none',t:'📡 最终 TLBI',a:1}],mhb:'ok'},
{n:'<b>后续访问重新 walk（以 PE-A 为例）:</b> PE-A 访问 VA 0x12345678 → L1 miss → 查共享 L2 → miss（已清空）→ walk 读到新页表 → 翻译结果为 4KB → <b>先填入 PE-A 私有 L1 TLB</b>。',pe:'rewalk-l1',l2:'empty',ops:[{c:'st-walk',t:'🔍 miss → walk',a:1},{c:'st-fill',t:'① 填入 PE-A L1',a:1}],mhb:''},
{n:'<b>级联到共享 L2 TLB:</b> walk 结果级联到共享 L2 TLB。从此共享 L2 里只有新 4KB entry，<b>multi-hit 窗口结束</b>。任何 PE 后续访问只命中这一条。',pe:'rewalk-l2',l2:'new4kb',ops:[{c:'st-fill',t:'① 填入 PE-A L1',a:0},{c:'st-cascade',t:'② 级联到共享 L2',a:1}],mhb:'done'}
];

function peHTML(type){
var a_l1='',b_l1='';
// PE-A L1
if(type==='init'||type==='a-hit'||type==='b-miss'||type==='b-walk-l1'||type==='b-walk-l2'){
a_l1='<div class="tent s2">VA=0x12345678<br>tag VA[47:21]=0x91 (2MB)<br>OA=0x6789A, RW, WB</div>';
}else if(type==='a-l2-query'||type==='both-have'||type==='clean'||type==='rewalk-l1'){
a_l1='<div class="tent empty">🗑️ L1 miss（旧 entry 被淘汰）</div>';
}else if(type==='rewalk-l2'){
a_l1='<div class="tent s4 new-entry">VA=0x12345678<br>tag VA[47:12]=0x12345 (4KB)<br>OA=0x6789A, RW, WB<br><small>✓ walk 填入的新 entry</small></div>';
}
// PE-B L1
if(type==='init'||type==='a-hit'){
b_l1='<div class="tent empty">没有该地址的 entry</div>';
}else if(type==='b-miss'){
b_l1='<div class="tent empty">🔍 miss → 准备 walk</div>';
}else if(type==='b-walk-l1'||type==='b-walk-l2'||type==='both-have'||type==='a-l2-query'){
b_l1='<div class="tent s4 new-entry">VA=0x12345678<br>tag VA[47:12]=0x12345 (4KB)<br>OA=0x6789A, RW, WB<br><small>✓ walk 填入的新 entry</small></div>';
}else if(type==='clean'){
b_l1='<div class="tent empty">🗑️ L1 miss</div>';
}else if(type==='rewalk-l1'||type==='rewalk-l2'){
b_l1='<div class="tent empty">L1 miss → 查共享 L2</div>';
}
return '<div class="pe-row"><div class="pe-box pe-a"><h4>🔒 PE-A 私有 L1 TLB</h4>'+a_l1+'</div><div class="pe-box pe-b"><h4>🔒 PE-B 私有 L1 TLB</h4>'+b_l1+'</div></div>';
}

function l2HTML(type){
var entries='';
if(type==='old2mb'){
entries='<div class="tent s2">VA=0x12345678 → tag VA[47:21]=0x91<br>2MB | OA=0x6789A, RW, WB<br><small style="color:#991b1b">旧 entry（拆页前缓存）</small></div>';
}else if(type==='both'){
entries='<div class="tent s2">VA=0x12345678 → tag VA[47:21]=0x91<br>2MB | OA=0x6789A, RW, WB<br><small style="color:#991b1b">旧 entry</small></div>';
entries+='<div class="flow-arrow" style="color:#f59e0b">⬇ PE-B walk 级联填入</div>';
entries+='<div class="tent s4 new-entry">VA=0x12345678 → tag VA[47:12]=0x12345<br>4KB | OA=0x6789A, RW, WB<br><small style="color:#166534">新 entry（级联填入）</small></div>';
}else if(type==='empty'||type==='rewalk-l1'){
entries='<div class="tent empty">🗑️ TLB 为空<br><small>最终 TLBI 清掉了新旧全部</small></div>';
}else if(type==='new4kb'||type==='rewalk-l2'){
entries='<div class="tent s4 new-entry">VA=0x12345678 → tag VA[47:12]=0x12345<br>4KB | OA=0x6789A, RW, WB<br><small style="color:#166534">✓ walk 后填充的新 entry（唯一）</small></div>';
}
return '<div class="shared-l2"><h4>🌐 共享 L2 TLB（多 PE 共用）</h4>'+entries+'</div>';
}

function opsHTML(ops){
if(!ops.length)return '';
return '<div class="ops">'+ops.map(function(o){var cls=o.a===undefined?'':(o.a?' active':' done');return '<span class="step-tag '+o.c+cls+'">'+o.t+'</span>'}).join('')+'</div>';
}

function mhbHTML(type){
if(!type)return '';
if(type==='multi')return '<div class="mhb show multi"><b>⚠ 共享 L2 TLB 里两条并存!</b><br>旧 2MB + 新 4KB，Tag 不同所以能共存<br>walk 结果级联到共享 L2 是 multi-hit 的触发点</div>';
if(type==='multi-detail')return '<div class="mhb show multi"><b>⚠ MULTI-HIT!</b><br>PE-A 查共享 L2 → 同时命中旧 2MB 和新 4KB<br>2MB 范围包含 4KB 范围，VA 落在两者之内<br><br>BBML2 硬件消解：abort 或一致结果（绝不融合）<br>BBML3：永不 abort，只返回一致结果</div>';
if(type==='ok')return '<div class="mhb show ok"><b>✅ 最终 TLBI 收尾</b><br>新旧 entry 全部清掉（TLBI 按地址失效，不区分新旧）<br>multi-hit 是共享 TLB 结构的瞬态</div>';
if(type==='done')return '<div class="mhb show ok"><b>✅ 重新 walk 完成！</b><br>TLB 里只有新 4KB entry，multi-hit 窗口结束<br>拆大页全流程完成</div>';
return '';
}

function render(){
var s=steps[step];
var html='<div class="nar">'+s.n+'</div>';
html+=peHTML(s.pe);
html+='<div class="flow-arrow">↕</div>';
html+=l2HTML(s.l2);
html+=opsHTML(s.ops);
html+=mhbHTML(s.mhb);
document.getElementById('content').innerHTML=html;
document.getElementById('bPrev').disabled=step<=0;
document.getElementById('bNext').disabled=step>=totalSteps-1;
var d='';for(var i=0;i<totalSteps;i++)d+='<div class="sd'+(i===step?' act':i<step?' done':'')+'"></div>';
document.getElementById('si').innerHTML=d;
}
function next(){if(step<totalSteps-1)step++;render()}
function prev(){if(step>0)step--;render()}
function rst(){step=0;render()}
rst();
</script>
</body>
</html>
